services:
  postgres:
    image: postgres:16
    container_name: quarry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quarry
    ports:
      - '5434:5432'
    volumes:
      - quarry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d quarry']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quarry_pg_data:
